<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data model diagram parts</title>
<!--
  DATA MODEL DIAGRAM TEMPLATE

  Parts for data model diagrams in a spec's Solution design. Each part is an SVG <g> with its origin at its
  top-left corner: copy it, set transform="translate(x,y)", change the labels. The comment above each part says
  when to use it. The classes come from the <style> of spec-template.html.

  How to write a data model diagram
  - Use a diagram when several entities relate to each other (a thread has messages, a message has an author).
    A single entity is clearer as a table with one row per field (see spec-example.html § Data model).
  - Model what is stored or exchanged — Yjs maps, JSON files, event payloads, database tables — not classes.
    Say where each entity lives in its header (Y.Map, file, table, event).
  - Show the fields the reader needs to understand the design, with types in the project's terms (TypeScript
    types, JSON types). Mark keys. Leave out bookkeeping fields unless the design depends on them.
  - Every relation has a multiplicity at the target end (1, 0..1, *). Use composition (diamond) when the child
    only exists inside the parent and is deleted with it; a plain arrow when it is a reference to something that
    lives on its own.
  - Entities defined in another spec appear dashed with only their name; link that spec in the prose.
  - Layout: the central entity left or top, what it contains to the right, enums and referenced entities at
    the edges. Route relation lines around entities, never through them.
  - Size: viewBox 720 wide. Name the markers uniquely per diagram.
  The parts and relations in this file are a starting set, not an exhaustive list. If a diagram needs a node
  type, relation or notation that is missing here, add it: draw it with the existing d-* classes in the same
  style, and explain it in the caption so the reader doesn't have to guess what it means.
  An example that combines the parts is at the end of this file.
-->
<style>
:root {
  --bg: #f7f6f3; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e1db; --line-strong: #b9b6ae;
  --accent: #3b5bdb; --accent-soft: #e7ecff; --code: #f0eee9; --note: #fff8e6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --surface: #1f1f1d; --text: #ecebe7; --muted: #a09e98; --line: #33322f; --line-strong: #5a5853;
    --accent: #8ea6ff; --accent-soft: #232a45; --code: #2a2927; --note: #2b2618;
  }
}
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
a { color: var(--accent); }
h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 21px; margin: 48px 0 12px; padding-top: 8px; border-top: 1px solid var(--line); }
.meta { color: var(--muted); margin: 0 0 24px; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: var(--code); padding: 1px 4px; border-radius: 4px; }
figure { margin: 16px 0; }
figcaption { color: var(--muted); font-size: 13px; margin-top: 4px; }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.parts figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
svg.diagram { display: block; width: 100%; height: auto; }
.parts svg.diagram { width: auto; max-width: 100%; height: auto; }
svg.diagram text { fill: var(--text); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
svg.diagram text.d-small { fill: var(--muted); font-size: 11px; }
svg.diagram text.d-title { fill: var(--muted); font-size: 12px; font-weight: 600; }
.d-box { fill: var(--surface); stroke: var(--text); stroke-width: 1.2; }
.d-focus { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
.d-ext { fill: var(--bg); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
.d-frame { fill: none; stroke: var(--line-strong); stroke-width: 1.2; }
.d-bound { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 4; }
.d-line { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.d-ret { stroke-dasharray: 4 3; }
.d-head { fill: var(--muted); }
.d-life { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 4; }
.d-solid { fill: var(--text); }
.d-act { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; }
.d-note { fill: var(--note); stroke: var(--line-strong); stroke-width: 1; }
.d-hollow { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; }
.d-lane { fill: none; stroke: var(--line-strong); stroke-width: 1; }
svg.diagram text.d-name { font-weight: 600; }
svg.diagram text.d-field { font: 12px ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<main>

<h1>Data model diagram parts</h1>
<p class="meta">Building parts for data model diagrams in a spec. How to use them is explained in the comments in
the source. Back to the <a href="spec-template.html">spec template</a>. The parts are not exhaustive; add what a diagram needs.</p>

<h2 id="entities">Entities</h2>
<div class="parts">

<!--
  ENTITY — one kind of record. Header 28 px: name (class d-name) left, where it is stored (d-small) right. One row
  of 20 px per field: name (class d-field) left, type (d-small) right-aligned. Height = 28 + 20 × fields + 10.
  A key field has its name in bold (add d-name) and "key" after its type. Width 180–200.
-->
<figure>
<svg class="diagram" width="220" height="128" viewBox="0 0 220 128" role="img" aria-label="Entity">
  <g transform="translate(10,10)">
    <rect class="d-box" width="200" height="108" rx="4"/>
    <line class="d-line" x1="0" y1="28" x2="200" y2="28"/>
    <text class="d-name" x="10" y="19">‹Entity›</text>
    <text class="d-small" x="190" y="19" text-anchor="end">‹stored in›</text>
    <text class="d-field d-name" x="10" y="46">‹id›</text>
    <text class="d-small" x="190" y="46" text-anchor="end">‹string› · key</text>
    <text class="d-field" x="10" y="66">‹field›</text>
    <text class="d-small" x="190" y="66" text-anchor="end">‹type›</text>
    <text class="d-field" x="10" y="86">‹field›</text>
    <text class="d-small" x="190" y="86" text-anchor="end">‹type› | null</text>
  </g>
</svg>
<figcaption>Entity</figcaption>
</figure>

<!--
  ENUM — a fixed set of values a field can take. Draw it as its own box when the values need explaining or several
  entities use it; otherwise write the values as the field's type ("open | resolved").
-->
<figure>
<svg class="diagram" width="200" height="128" viewBox="0 0 200 128" role="img" aria-label="Enum">
  <g transform="translate(10,10)">
    <rect class="d-box" width="180" height="104" rx="4"/>
    <text class="d-small" x="90" y="15" text-anchor="middle">«enum»</text>
    <text class="d-name" x="90" y="32" text-anchor="middle">‹Name›</text>
    <line class="d-line" x1="0" y1="40" x2="180" y2="40"/>
    <text class="d-field" x="10" y="58">‹value›</text>
    <text class="d-field" x="10" y="76">‹value›</text>
    <text class="d-field" x="10" y="94">‹value›</text>
  </g>
</svg>
<figcaption>Enum</figcaption>
</figure>

<!--
  EXTERNAL ENTITY — an entity this feature references but another feature or system defines. Name only, dashed;
  its fields are documented where it is defined.
-->
<figure>
<svg class="diagram" width="200" height="60" viewBox="0 0 200 60" role="img" aria-label="External entity">
  <g transform="translate(10,10)">
    <rect class="d-ext" width="180" height="36" rx="4"/>
    <text class="d-name" x="90" y="17" text-anchor="middle">‹Entity›</text>
    <text class="d-small" x="90" y="31" text-anchor="middle">defined in F‹NN›</text>
  </g>
</svg>
<figcaption>External entity</figcaption>
</figure>

</div>

<h2 id="relations">Relations</h2>

<!--
  RELATIONS — start at the row of the field that holds the relation, end at the target entity's edge.
  - Reference (arrow): the field points to something that exists on its own. Multiplicity (d-small) next to the
    arrowhead.
  - Composition (diamond at the owner, no arrowhead): the child exists only inside the owner and is deleted with
    it. Multiplicity at the child end.
  Multiplicities: 1 (exactly one), 0..1 (optional), * (any number), 1..* (at least one).
-->
<figure>
<svg class="diagram" viewBox="0 0 720 90" role="img" aria-label="Relations">
  <defs>
    <marker id="m-dmp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m-dmp-dia" viewBox="0 0 14 8" refX="0" refY="4" markerWidth="14" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="d-head" d="M0,4 L7,0 L14,4 L7,8 z"/></marker>
  </defs>
  <line class="d-line" x1="40" y1="35" x2="300" y2="35" marker-end="url(#m-dmp)"/>
  <text class="d-small" x="292" y="27" text-anchor="end">1</text>
  <text x="170" y="70" text-anchor="middle">Reference</text>
  <line class="d-line" x1="420" y1="35" x2="680" y2="35" marker-start="url(#m-dmp-dia)"/>
  <text class="d-small" x="676" y="27" text-anchor="end">*</text>
  <text x="550" y="70" text-anchor="middle">Composition</text>
</svg>
<figcaption>Reference and composition, each with its multiplicity.</figcaption>
</figure>

<h2 id="example">Example</h2>

  the design of the comments feature. Note the compositions (messages and anchor live inside a thread), the

-->

    <marker id="m-dmx-dia" viewBox="0 0 14 8" refX="0" refY="4" markerWidth="14" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="d-head" d="M0,4 L7,0 L14,4 L7,8 z"/></marker>
  </defs>
  <g transform="translate(40,40)">
    <rect class="d-box" width="200" height="178" rx="4"/>

    <text class="d-small" x="190" y="106" text-anchor="end">open | resolved</text>
    <text class="d-field" x="10" y="126">messages</text>
    <text class="d-small" x="190" y="126" text-anchor="end">Message[]</text>
    <text class="d-field" x="10" y="146">anchor</text>
    <text class="d-small" x="190" y="146" text-anchor="end">Anchor | null</text>
    <text class="d-field" x="10" y="166">quote</text>
    <text class="d-small" x="190" y="166" text-anchor="end">string</text>
  </g>
  <g transform="translate(290,40)">
    <rect class="d-box" width="190" height="98" rx="4"/>
    <line class="d-line" x1="0" y1="28" x2="190" y2="28"/>
    <text class="d-name" x="10" y="19">Message</text>
    <text class="d-small" x="180" y="19" text-anchor="end">in Thread</text>
    <text class="d-field" x="10" y="46">author</text>
    <text class="d-small" x="180" y="46" text-anchor="end">Author</text>
    <text class="d-field" x="10" y="66">text</text>
    <text class="d-small" x="180" y="66" text-anchor="end">string</text>
    <text class="d-field" x="10" y="86">sentSeq</text>
    <text class="d-small" x="180" y="86" text-anchor="end">number | null</text>
  </g>
  <g transform="translate(520,40)">
    <rect class="d-box" width="180" height="98" rx="4"/>
    <line class="d-line" x1="0" y1="28" x2="180" y2="28"/>
    <text class="d-name" x="10" y="19">Author</text>
    <text class="d-field" x="10" y="46">name</text>
    <text class="d-small" x="170" y="46" text-anchor="end">string</text>
    <text class="d-field" x="10" y="66">kind</text>
    <text class="d-small" x="170" y="66" text-anchor="end">user | agent</text>
    <text class="d-field" x="10" y="86">color</text>
    <text class="d-small" x="170" y="86" text-anchor="end">string</text>
  </g>
  <g transform="translate(290,220)">
    <rect class="d-box" width="190" height="78" rx="4"/>
    <line class="d-line" x1="0" y1="28" x2="190" y2="28"/>
    <text class="d-name" x="10" y="19">Anchor</text>
    <text class="d-small" x="180" y="19" text-anchor="end">in Thread</text>
    <text class="d-field" x="10" y="46">from</text>
    <text class="d-small" x="180" y="46" text-anchor="end">RelativePosition</text>
    <text class="d-field" x="10" y="66">to</text>
    <text class="d-small" x="180" y="66" text-anchor="end">RelativePosition</text>
  </g>
  <text class="d-small" x="290" y="314">null anchor = detached</text>
  <g transform="translate(520,190)">
    <rect class="d-box" width="180" height="122" rx="4"/>

  <path class="d-line" d="M240,162 H262 V90 H288" marker-start="url(#m-dmx-dia)"/>
  <text class="d-small" x="282" y="84" text-anchor="end">*</text>

  <text class="d-small" x="282" y="252" text-anchor="end">0..1</text>

<figcaption>Example: comment threads stored next to the document. Illustration only.</figcaption>

</main>
</body>
</html>
