name: pr-title

# Pull-request titles become the commit message on main (squash merge) and must follow Conventional Commits.
# No checkout, no third-party action and no secret: the title is only read from the event.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9-]*\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "Title follows Conventional Commits: $TITLE"
          else
            echo "::error title=Pull-request title::'$TITLE' does not follow Conventional Commits: type(scope)?: description, with type one of feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
