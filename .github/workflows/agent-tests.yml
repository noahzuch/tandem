name: agent-tests

# Agent tests cost model usage and their results vary, so they run only on demand: started by hand, or when the
# maintainer adds the label `agent-tests` to a pull request. Not a required check. The Claude credential is used only
# here and never for pull requests from forks.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  LEFTHOOK: '0'

jobs:
  agent-tests:
    name: agent-tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'agent-tests' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17

      - name: Setup
        run: mise run setup

      - name: Install Claude Code's sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: mise run test-agent-ci
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: mise run test-agent-ci

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-test-reports
          path: reports/
          if-no-files-found: ignore
